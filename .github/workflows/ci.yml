name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_call:
    inputs:
      skip-build-smoke:
        description: Skip building and smoke-testing the wheel inside the CI job
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Sync
        run: uv sync --locked --all-extras --dev

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Types
        run: uv run ty check

      - name: Import contracts
        run: uv run lint-imports

      - name: Markdown lint
        run: uv run rumdl check .

      - name: Test
        run: uv run pytest tests --cov=unsat

      - name: Test legacy
        run: uv run pytest packages/unsat-legacy/tests

      - name: Run benchmark suite check
        run: uv run python benchmarks/run.py --suite all --check

      - name: Build and smoke-test wheel
        if: ${{ !inputs.skip-build-smoke }}
        shell: bash
        run: |
          set -euo pipefail
          uv build
          shopt -s nullglob
          wheels=(dist/*.whl)
          if [ "${#wheels[@]}" -ne 1 ]; then
            echo "Expected 1 wheel in dist/, found ${#wheels[@]}" >&2
            exit 1
          fi
          uv run --isolated --no-project --with "${wheels[0]}" python - <<'EOF'
          from pathlib import Path
          import unsat

          pkg_dir = Path(unsat.__file__).resolve().parent
          if not (pkg_dir / "py.typed").is_file():
              raise SystemExit("py.typed is missing from installed wheel")

          x = unsat.Int("x")
          s = unsat.Solver()
          s.add(x > 0)
          if s.check() is not unsat.SAT:
              raise SystemExit("Wheel smoke check failed: expected SAT for x > 0")
          EOF
          uv run --isolated --no-project --with "${wheels[0]}" unsat --version
          uv run --isolated --no-project --with "${wheels[0]}" unsat - --format smt2 <<'EOF' | grep -qx 'sat'
          (set-logic QF_LIA)
          (declare-const x Int)
          (assert (> x 0))
          (check-sat)
          EOF

  platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Sync
        run: uv sync --locked --all-extras --dev

      - name: Test
        run: uv run pytest tests
