name: Publish to PyPI

on:
  push:
    tags: ["v*"]

jobs:
  verify:
    name: Verify tag and test suite
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Verify release tag matches pyproject.toml version
        run: |
          uv run python -c "
          import os, tomllib
          tag = os.environ['GITHUB_REF_NAME'].removeprefix('v')
          with open('pyproject.toml', 'rb') as f:
              version = tomllib.load(f)['project']['version']
          assert tag == version, f'Tag {tag!r} != pyproject version {version!r}'
          "

      - name: Run ruff check
        run: uv run ruff check .

      - name: Run ruff format check
        run: uv run ruff format --check .

      - name: Run ty check
        run: uv run ty check

      - name: Run import-linter
        run: uv run lint-imports

      - name: Run rumdl check
        run: uv run rumdl check .

      - name: Run tests
        run: uv run pytest tests

      - name: Run benchmark suite check
        run: uv run python benchmarks/run.py --check

  build:
    name: Build distribution
    needs: [verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Build wheel and sdist
        run: uv build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/unsat
    permissions:
      id-token: write
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Publish package to PyPI
        run: uv publish
