[project]
name = "unsat"
version = "0.3.0"
description = "A Z3-inspired SMT solver in Python"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "noise01" }]
requires-python = ">=3.14"
dependencies = []
keywords = [
    "smt",
    "sat",
    "solver",
    "cdcl",
    "theorem-proving",
    "formal-verification",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/noise01/unsat"
Repository = "https://github.com/noise01/unsat"
Issues = "https://github.com/noise01/unsat/issues"
Changelog = "https://github.com/noise01/unsat/blob/main/CHANGELOG.md"

[project.scripts]
unsat = "unsat.cli:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
unsat-legacy = { workspace = true }

[dependency-groups]
dev = [
    "hypothesis>=6.170.17",
    "import-linter>=2.17",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "pyyaml>=6.0.3",
    "ruff>=0.17.6",
    "rumdl>=0.3.6",
    "ty>=0.0.111",
    "unsat-legacy",
    "z3-solver>=4.13",
]

[tool.coverage.run]
source = ["src/unsat"]
branch = true

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = true
fail_under = 80

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["src/unsat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 30
addopts = ["--strict-markers", "--strict-config"]

[tool.ruff]
target-version = "py314"
line-length = 120
extend-exclude = ["packages/unsat-legacy"]

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",  # handled by the formatter
    "CPY001",  # license stated in LICENSE rather than per-file headers
    "D1",      # docstrings reviewed by humans rather than lint
    "D203",    # incompatible with D211 (no blank line before class docstring)
    "D213",    # incompatible with D212 (multi-line summary on first line)
    "D413",    # no blank line after the last docstring section
    "ERA001",  # mathematical derivations in comments can look like code statements
    "PLR0911", # dispatch functions return early per branch
    # PEP 649 evaluates exported annotations at runtime; keep annotated imports live.
    "TC001",
    "TC002",
    "TC003",
    # Solver algorithms, dispatchers, and theory helpers have intrinsic branching and state.
    "C901",
    "FBT001",
    "FBT003",
    "N802",    # Z3-compatible CamelCase DSL builders
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR0917",
    "PLR2004", # bit-width and algebraic constants are clearer inline
    "S101",    # internal solver invariants use assert
    "SLF001",  # tightly coupled solver components share private helpers
    "TRY004",  # public APIs raise ValueError on invalid inputs/types for compatibility
]

[tool.ruff.lint.per-file-ignores]
"benchmarks/**/*.py" = [
    "ANN401",
    "INP001",
    "T201",
]
"src/unsat/api.py" = [
    "PLW0603", # module-level default AST context setter
]
"src/unsat/cli.py" = [
    "T201",    # CLI stdout/stderr output
]
"tests/**/*.py" = [
    "ANN001",
    "ANN201",
    "ANN202",
    "D400",
    "D415",
    "INP001",
    "S311",
    "S603",
]

[tool.importlinter]
root_package = "unsat"

[[tool.importlinter.contracts]]
name = "Layered solver architecture"
type = "layers"
containers = ["unsat"]
exhaustive = true
layers = [
    "__main__",
    "cli",
    "parser | api",
    "smt",
    "quantifiers",
    "theories | tactics",
    "model",
    "syntax | sat",
]

[[tool.importlinter.contracts]]
name = "Internal modules must not import the public facade"
type = "protected"
protected_modules = ["unsat"]
allowed_importers = []
as_packages = false

[[tool.importlinter.contracts]]
name = "The public facade imports only api directly"
type = "forbidden"
source_modules = ["unsat"]
forbidden_modules = ["unsat.**"]
as_packages = false
allow_indirect_imports = true
ignore_imports = ["unsat -> unsat.api"]
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
name = "Main entry point delegates exclusively to cli"
type = "forbidden"
source_modules = ["unsat.__main__"]
forbidden_modules = [
    "unsat.parser",
    "unsat.api",
    "unsat.smt",
    "unsat.quantifiers",
    "unsat.theories",
    "unsat.tactics",
    "unsat.model",
    "unsat.syntax",
    "unsat.sat",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "CLI accesses solver internals through parser, smt and sat"
type = "forbidden"
source_modules = ["unsat.cli"]
forbidden_modules = [
    "unsat.api",
    "unsat.quantifiers",
    "unsat.theories",
    "unsat.tactics",
    "unsat.model",
    "unsat.syntax",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Parser accesses solver internals through smt, sat, model and syntax"
type = "forbidden"
source_modules = ["unsat.parser"]
forbidden_modules = [
    "unsat.quantifiers",
    "unsat.theories",
    "unsat.tactics",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "API accesses solver internals through smt"
type = "forbidden"
source_modules = ["unsat.api"]
forbidden_modules = ["unsat.sat", "unsat.quantifiers", "unsat.theories", "unsat.tactics"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Lower layers must not depend on sat"
type = "forbidden"
source_modules = [
    "unsat.quantifiers",
    "unsat.theories",
    "unsat.tactics",
    "unsat.model",
    "unsat.syntax",
]
forbidden_modules = [
    "unsat.sat",
]

[[tool.importlinter.contracts]]
name = "Quantifiers must not depend on tactics"
type = "forbidden"
source_modules = [
    "unsat.quantifiers",
]
forbidden_modules = [
    "unsat.tactics",
]

[tool.rumdl]
disable = ["MD013"]
